<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found | Tridel</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1720;
      color: #f8fafc;
    }

    main {
      text-align: center;
      padding: 32px;
      max-width: 560px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    p {
      margin: 0 0 20px;
      color: rgba(248, 250, 252, 0.78);
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: #00aae7;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The requested resource was not found.</p>
    <a href="/">Return Home</a>
  </main>
</body>
</html>
